name: "Build release packages"
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Use the release tag as extension version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            npm pkg set version="$VERSION"
          else
            echo "::warning::Tag $TAG is not a valid extension version, keeping $(npm pkg get version)"
          fi
      - name: Build the extension
        run: pnpm build
      - name: Package the extension
        run: pnpm package
      - name: Rename packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir dist
          cp build/chrome-mv3-prod.zip "dist/zoho-crm-sidekick-chrome-$VERSION.zip"
          cp build/firefox-mv3-prod.zip "dist/zoho-crm-sidekick-firefox-$VERSION.zip"
      - name: Sign the Firefox package
        if: github.event_name == 'release' && env.AMO_JWT_ISSUER != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes web-ext@8 sign \
            --source-dir build/firefox-mv3-prod \
            --artifacts-dir web-ext-artifacts \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 900000
          cp web-ext-artifacts/*.xpi "dist/zoho-crm-sidekick-firefox-$VERSION.xpi"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: dist/*
      - name: Attach packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
